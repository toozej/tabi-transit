name: Quality and contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Pre-commit, static checks, tests, and contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the untrusted revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew for repository-managed nvm
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            .cache/pre-commit
          key:
            ${{ runner.os }}-${{ runner.arch }}-repository-tools-${{ hashFiles('Makefile',
            '.pre-commit-config.yaml', 'tools/go-tools.tsv', 'tools/binary-tools.tsv', 'tools/requirements.txt', 'scripts/manage-go-tools.sh', 'scripts/manage-binary-tools.sh', 'scripts/with-node.sh')
            }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-repository-tools-
      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Run repository pre-commit workflow
        run: make pre-commit-run

  compose-and-fixtures:
    name: Compose topology and deterministic fixture integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the untrusted revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Validate the canonical Compose topology
        run: bash deployment/scripts/validate-compose.sh
      - name: Run deterministic API and mobile fixture integration checks
        run: tests/integration/run.sh
