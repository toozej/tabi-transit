name: Quality and contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Pre-commit, static checks, tests, and contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the untrusted revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            .cache/pre-commit
          key:
            ${{ runner.os }}-${{ runner.arch }}-repository-tools-${{ hashFiles('Makefile',
            '.pre-commit-config.yaml', 'tools/go-tools.tsv', 'tools/requirements.txt', 'scripts/manage-go-tools.sh')
            }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-repository-tools-
      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Run repository pre-commit workflow
        run: make pre-commit-run

  compose-and-fixtures:
    name: Compose topology and deterministic fixture integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the untrusted revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Validate the canonical Compose topology
        run: bash deployment/scripts/validate-compose.sh
      - name: Run deterministic API and mobile fixture integration checks
        run: tests/integration/run.sh
