name: Release input validation

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable backend image reference (registry/image@sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  immutable-image-input:
    name: Validate release image precondition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the selected revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject tags and incomplete container build artifacts
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: bash scripts/ci/validate-release-input.sh "$IMAGE_REF"
      - name: Check Dockerfile syntax and policy shape
        run: docker build --check .
