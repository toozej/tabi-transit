openapi: 3.0.3
info:
  title: Tabi Transit API
  version: 0.1.0
  description: |
    Public, normalized transit data API. All instants use ISO 8601 UTC, all
    coordinates are GeoJSON-position arrays ordered [longitude, latitude], and
    realtime values always include freshness metadata.
  contact:
    name: Tabi Transit
servers:
  - url: https://api.example.invalid
    description: Placeholder public API origin; clients configure the deployment origin.
tags:
  - name: Health
    description: Process liveness and data readiness.
  - name: Configuration
    description: Public client configuration without credentials.
  - name: Stops
    description: Normalized static and nearby stop data.
  - name: Routes
    description: Normalized static route data.
  - name: Vehicles
    description: Current normalized vehicle snapshots.
  - name: Alerts
    description: Normalized service alerts with preserved source semantics.
  - name: Search
    description: Provider-neutral transit and place discovery for picker flows.
  - name: Journeys
    description: Feature-gated normalized A-to-B planning.
  - name: Notifications
    description: Feature-gated installation-owned notification preferences.
security: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Report whether the process is live.
      responses:
        "200":
          description: The process is accepting requests.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/HealthResponse" },
                  example: { status: ok, requestId: req_live_01 },
                },
            }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Report whether core data can be served.
      responses:
        "200":
          description: Core data is available.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/HealthResponse" },
                  example: { status: ok, requestId: req_ready_01 },
                },
            }
        "503": { $ref: "#/components/responses/TemporarilyUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/config:
    get:
      tags: [Configuration]
      operationId: getConfig
      summary: Get public application and data-source configuration.
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200":
          description: Public configuration without credentials.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Api-Version: { $ref: "#/components/headers/ApiVersion" },
            }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ConfigResponse" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/ConfigResponse" },
                    },
                },
            }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: List normalized routes.
      parameters:
        - { $ref: "#/components/parameters/Modes" }
        - name: serviceDate
          in: query
          schema: { $ref: "#/components/schemas/ServiceDate" }
        - name: query
          in: query
          description: Case-insensitive route display-name or ID prefix; no provider query is performed.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: A stable page of routes.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/RouteCollection" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/RouteCollection" },
                    },
                },
            }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/stops:
    get:
      tags: [Stops]
      operationId: listStops
      summary: List or prefix-search normalized stops.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - { $ref: "#/components/parameters/Modes" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A stable page of stops.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/StopCollection" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/StopCollection" },
                    },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/stops/nearby:
    get:
      tags: [Stops]
      operationId: listNearbyStops
      summary: Find nearby stops grouped by selected mode.
      description: Distances are straight-line meters. `limitPerMode` limits each mode group independently; `limit` caps the total result count.
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
        - name: radiusMeters
          in: query
          schema: { type: integer, minimum: 50, maximum: 10000, default: 1000 }
        - { $ref: "#/components/parameters/Modes" }
        - { $ref: "#/components/parameters/Limit" }
        - name: limitPerMode
          in: query
          schema: { type: integer, minimum: 1, maximum: 20 }
        - name: includeArrivals
          in: query
          schema: { type: boolean, default: false }
        - name: wheelchairAccessible
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Nearby stops ordered by distance within each mode group.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/NearbyStopsResponse" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/NearbyStopsResponse" },
                    },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/stops/{id}:
    get:
      tags: [Stops]
      operationId: getStop
      summary: Get stable stop details, serving routes, and static freshness.
      parameters:
        - { $ref: "#/components/parameters/StopId" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: A normalized stop; realtime arrivals are retrieved separately.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopDetailResponse" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/StopDetailResponse" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/stops/{id}/arrivals:
    get:
      tags: [Stops]
      operationId: listStopArrivals
      summary: Get scheduled and, when available, estimated arrivals at a stop.
      description: An estimated time is never fabricated. A stale response is explicitly marked and does not imply live tracking.
      parameters:
        - { $ref: "#/components/parameters/StopId" }
        - name: minutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 240, default: 90 }
        - name: routes
          in: query
          description: Comma-separated source-qualified route IDs.
          schema: { type: string, maxLength: 2000 }
        - name: directionId
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: includeScheduled
          in: query
          schema: { type: boolean, default: true }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Ordered upcoming arrivals, including their source freshness.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrivalCollection" }
              examples:
                {
                  response: { $ref: "#/components/examples/ArrivalCollection" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/stops/{id}/schedule:
    get:
      tags: [Stops]
      operationId: listStopSchedule
      summary: Get static scheduled stop times for one service date.
      description: Times use the agency service-day calendar; service-day seconds may exceed 86400 after midnight.
      parameters:
        - { $ref: "#/components/parameters/StopId" }
        - { $ref: "#/components/parameters/ServiceDateQuery" }
        - name: routeId
          in: query
          schema: { $ref: "#/components/schemas/QualifiedId" }
        - name: directionId
          in: query
          schema: { type: integer, enum: [0, 1] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: A stable page of static schedule times.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleCollection" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/ScheduleCollection" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/routes/{id}:
    get:
      tags: [Routes]
      operationId: getRoute
      summary: Get a route and its known directions.
      parameters:
        - { $ref: "#/components/parameters/RouteId" }
        - { $ref: "#/components/parameters/ServiceDateQuery" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Static route details for the selected service date when supplied.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteDetailResponse" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/RouteDetailResponse" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/routes/{id}/shape:
    get:
      tags: [Routes]
      operationId: getRouteShape
      summary: Get a route shape as GeoJSON.
      parameters:
        - { $ref: "#/components/parameters/RouteId" }
        - name: directionId
          in: query
          schema: { type: integer, enum: [0, 1] }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: A static route geometry. When more than one shape applies, features remain separately identified.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/geo+json:
              schema:
                { $ref: "#/components/schemas/RouteShapeFeatureCollection" }
              examples:
                {
                  response:
                    {
                      $ref: "#/components/examples/RouteShapeFeatureCollection",
                    },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/routes/{id}/stops:
    get:
      tags: [Routes]
      operationId: listRouteStops
      summary: Get ordered route stops for a direction and service date.
      parameters:
        - { $ref: "#/components/parameters/RouteId" }
        - { $ref: "#/components/parameters/ServiceDateQuery" }
        - name: directionId
          in: query
          schema: { type: integer, enum: [0, 1] }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Ordered static route stops.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteStopCollection" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/RouteStopCollection" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/routes/{id}/vehicles:
    get:
      tags: [Routes, Vehicles]
      operationId: listRouteVehicles
      summary: Get current normalized vehicles for one route.
      parameters:
        - { $ref: "#/components/parameters/RouteId" }
        - name: directionId
          in: query
          schema: { type: integer, enum: [0, 1] }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Current route vehicles; stale data is explicitly marked.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleCollection" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/static/manifest:
    get:
      tags: [Configuration]
      operationId: getStaticManifest
      summary: Get the versioned static-data manifest for offline synchronization.
      description: The manifest only describes normalized static artifacts. Artifact URLs are optional until a storage and retention policy is approved.
      parameters: [{ $ref: "#/components/parameters/IfNoneMatch" }]
      responses:
        "200":
          description: A static feed manifest suitable for conditional mobile synchronization.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
              X-Static-Feed-Version:
                { $ref: "#/components/headers/StaticFeedVersion" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaticManifestResponse" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/StaticManifestResponse" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: List normalized active or recently updated service alerts.
      parameters:
        - name: routes
          in: query
          schema: { type: string, maxLength: 2000 }
        - name: stops
          in: query
          schema: { type: string, maxLength: 2000 }
        - { $ref: "#/components/parameters/Modes" }
        - name: effect
          in: query
          schema: { $ref: "#/components/schemas/AlertEffect" }
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - name: updatedSince
          in: query
          schema: { $ref: "#/components/schemas/Timestamp" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: A page of alerts, preserving source wording where it is available.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertCollection" }
              examples:
                { response: { $ref: "#/components/examples/AlertCollection" } }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/alerts/{id}:
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Get one normalized alert revision.
      parameters:
        - { $ref: "#/components/parameters/AlertId" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: An alert with source wording, affected entities, active periods, and freshness.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDetailResponse" }
              examples:
                {
                  response:
                    { $ref: "#/components/examples/AlertDetailResponse" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: Get the current normalized vehicle snapshot.
      parameters:
        - { $ref: "#/components/parameters/Modes" }
        - name: routes
          in: query
          description: Comma-separated source-qualified route IDs.
          schema: { type: string, maxLength: 2000 }
        - name: directions
          in: query
          schema: { type: string, pattern: "^(0|1)(,(0|1))*$" }
        - name: sources
          in: query
          schema: { type: string, maxLength: 500 }
        - name: freshness
          in: query
          schema: { $ref: "#/components/schemas/FreshnessStatus" }
        - name: bbox
          in: query
          description: west,south,east,north in WGS84 degrees.
          schema:
            {
              type: string,
              pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$',
            }
        - name: format
          in: query
          schema: { type: string, enum: [json, geojson], default: json }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Current vehicle snapshot; stale records are explicitly marked.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/VehicleCollection" }
                  - { $ref: "#/components/schemas/VehicleFeatureCollection" }
              examples:
                {
                  json: { $ref: "#/components/examples/VehicleCollection" },
                  geojson: { $ref: "#/components/examples/VehicleGeoJSON" },
                }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/SourceUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/vehicles/search:
    get:
      tags: [Vehicles]
      operationId: searchVehicles
      summary: Search current vehicle IDs, exact match first.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            {
              type: string,
              minLength: 1,
              maxLength: 100,
              pattern: "^[A-Za-z0-9:_-]+$",
            }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Exact match, if present, precedes partial matches.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/VehicleSearchResponse" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/VehicleSearchResponse" },
                    },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/vehicles/{id}:
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: Get one current normalized vehicle.
      parameters:
        [
          { $ref: "#/components/parameters/VehicleId" },
          { $ref: "#/components/parameters/IfNoneMatch" },
        ]
      responses:
        "200":
          description: Current vehicle detail. Unsupported source fields are omitted.
          headers:
            {
              ETag: { $ref: "#/components/headers/ETag" },
              X-Request-Id: { $ref: "#/components/headers/RequestId" },
            }
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/VehicleDetailResponse" },
                  examples:
                    {
                      response:
                        { $ref: "#/components/examples/VehicleDetailResponse" },
                    },
                },
            }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/search:
    get:
      tags: [Search]
      operationId: searchPlaces
      summary: Find normalized transit entities and, when enabled, provider-neutral places.
      description: |
        Exact Tabi transit matches precede optional external place results. The optional
        `sessionId` is an opaque, short-lived picker session identifier; it is not a
        provider token and clients must not persist it. External search is disabled
        until the Mapbox terms, attribution, storage, and budget decision gate passes.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: types
          in: query
          description: Comma-separated result kinds to include.
          schema: { $ref: "#/components/schemas/PlaceKinds" }
        - name: lat
          in: query
          description: Optional explicit proximity for this request. It is not retained by the API.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          description: Optional explicit proximity for this request. It is not retained by the API.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: bbox
          in: query
          description: Optional WGS84 west,south,east,north bias or restriction.
          schema: { type: string, maxLength: 128 }
        - name: language
          in: query
          schema: { type: string, minLength: 2, maxLength: 35 }
        - name: sessionId
          in: query
          description: Opaque ephemeral picker session identifier; never a provider credential.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Exact normalized transit matches appear before other results.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceSearchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/geocode/reverse:
    get:
      tags: [Search]
      operationId: reverseGeocode
      summary: Resolve a coordinate to a provider-neutral place when enabled.
      description: |
        This endpoint is feature-gated pending Mapbox terms, attribution, storage, and
        budget review. Request coordinates are used only for this explicit operation
        and are not a history API.
      parameters:
        - { $ref: "#/components/parameters/Latitude" }
        - { $ref: "#/components/parameters/Longitude" }
        - name: language
          in: query
          schema: { type: string, minLength: 2, maxLength: 35 }
        - name: sessionId
          in: query
          description: Opaque ephemeral picker session identifier; never a provider credential.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: A normalized place result with any required attribution.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReverseGeocodeResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/journeys/plan:
    post:
      tags: [Journeys]
      operationId: planJourney
      summary: Plan a normalized A-to-B journey when the planner feature is enabled.
      description: |
        Provider responses are normalized before they leave the backend. Unsupported
        preferences are disclosed in `unsupportedPreferences`; hard constraints are
        enforced or the request returns no itineraries. The planner remains disabled
        until the TriMet AppID and terms/rate/cache/attribution decision gate passes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyPlanRequest" }
      responses:
        "200":
          description: Ranked normalized itineraries, which may be empty when no option meets hard constraints.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyPlanResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/installations:
    post:
      tags: [Notifications]
      operationId: createInstallation
      summary: Create an opaque, no-account installation identity when notifications are enabled.
      description: |
        The one-time `installationCredential` is an opaque secret returned only over TLS.
        Clients keep it in platform secure storage. The API stores only a verifier and never
        returns the credential again. This endpoint is disabled until encrypted persistence
        and push-provider operations are approved.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/InstallationCreateRequest" },
              },
          }
      responses:
        "201":
          description: Installation created; credential is returned exactly once.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/InstallationCreateResponse" },
                },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/installations/{id}:
    delete:
      tags: [Notifications]
      operationId: deleteInstallation
      summary: Delete an installation and its push tokens, subscriptions, and deliveries.
      security: [{ InstallationCredential: [] }]
      parameters: [{ $ref: "#/components/parameters/InstallationId" }]
      responses:
        "204": { description: Installation and notification data deleted. }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/installations/{id}/push-token:
    put:
      tags: [Notifications]
      operationId: registerPushToken
      summary: Register or rotate a push token for an owned installation.
      description: The push token is write-only and is never included in a response or error.
      security: [{ InstallationCredential: [] }]
      parameters: [{ $ref: "#/components/parameters/InstallationId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/PushTokenRegistration" },
              },
          }
      responses:
        "204": { description: Push token registered or rotated. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/subscriptions:
    get:
      tags: [Notifications]
      operationId: listSubscriptions
      summary: List notification subscriptions owned by the installation.
      security: [{ InstallationCredential: [] }]
      responses:
        "200":
          description: Installation-owned subscriptions, without push tokens.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SubscriptionCollection" },
                },
            }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [Notifications]
      operationId: createSubscription
      summary: Create a scoped service-alert or one-shot departure-reminder subscription.
      description: Quiet hours use a validated IANA zone; expired or late time-sensitive notifications are dropped rather than queued.
      security: [{ InstallationCredential: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/SubscriptionCreateRequest" },
              },
          }
      responses:
        "201":
          description: Subscription created.
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Subscription" } },
            }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /v1/subscriptions/{id}:
    delete:
      tags: [Notifications]
      operationId: deleteSubscription
      summary: Delete an installation-owned notification subscription.
      security: [{ InstallationCredential: [] }]
      parameters: [{ $ref: "#/components/parameters/SubscriptionId" }]
      responses:
        "204": { description: Subscription deleted. }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FeatureUnavailable" }
        default: { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    InstallationCredential:
      type: apiKey
      in: header
      name: X-Tabi-Installation-Credential
      description: Opaque installation credential. Never log, persist in fixtures, or return after installation registration.
  headers:
    RequestId:
      {
        description: Correlation ID generated or accepted by the API.,
        schema: { type: string, maxLength: 128 },
      }
    ETag:
      {
        description: Validator for this representation.,
        schema: { type: string },
      }
    ApiVersion: { description: API semantic version., schema: { type: string } }
    StaticFeedVersion:
      { description: Active static feed version., schema: { type: string } }
  parameters:
    InstallationId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/InstallationId" },
      }
    SubscriptionId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/SubscriptionId" },
      }
    IfNoneMatch: { name: If-None-Match, in: header, schema: { type: string } }
    Latitude:
      {
        name: lat,
        in: query,
        required: true,
        schema: { type: number, minimum: -90, maximum: 90 },
      }
    Longitude:
      {
        name: lon,
        in: query,
        required: true,
        schema: { type: number, minimum: -180, maximum: 180 },
      }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
      }
    Cursor:
      {
        name: cursor,
        in: query,
        description: Opaque cursor returned by a prior response.,
        schema: { type: string, minLength: 1, maxLength: 1000 },
      }
    Modes:
      {
        name: modes,
        in: query,
        description: Comma-separated modes.,
        schema:
          {
            type: string,
            pattern: "^(bus|light_rail|streetcar|commuter_rail|ferry|unknown)(,(bus|light_rail|streetcar|commuter_rail|ferry|unknown))*$",
          },
      }
    VehicleId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/QualifiedId" },
      }
    StopId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/QualifiedId" },
      }
    RouteId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/QualifiedId" },
      }
    AlertId:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/QualifiedId" },
      }
    ServiceDateQuery:
      {
        name: serviceDate,
        in: query,
        schema: { $ref: "#/components/schemas/ServiceDate" },
      }
  responses:
    NotModified: { description: Representation is unchanged. }
    ValidationError:
      {
        description: Invalid request input.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/ErrorResponse" },
                examples:
                  {
                    response: { $ref: "#/components/examples/ValidationError" },
                  },
              },
          },
      }
    NotFound:
      {
        description: Requested entity was not found.,
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/ErrorResponse" },
                examples:
                  { response: { $ref: "#/components/examples/NotFound" } },
              },
          },
      }
    SourceUnavailable:
      {
        description: Required source is unavailable.,
        headers: { Retry-After: { schema: { type: integer, minimum: 1 } } },
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/ErrorResponse" },
                examples:
                  {
                    response:
                      { $ref: "#/components/examples/SourceUnavailable" },
                  },
              },
          },
      }
    FeatureUnavailable:
      {
        description: Requested optional feature is disabled pending its documented decision gate or is temporarily unavailable.,
        headers: { Retry-After: { schema: { type: integer, minimum: 1 } } },
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    TemporarilyUnavailable:
      {
        description: Service cannot yet serve core data.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
    ErrorResponse:
      {
        description: Safe API error.,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorResponse" } },
          },
      }
  schemas:
    InstallationId:
      {
        type: string,
        minLength: 3,
        maxLength: 255,
        pattern: "^[a-z0-9][a-z0-9_-]*:[A-Za-z0-9:_-]+$",
        description: Opaque installation ID; never a device identifier.,
      }
    SubscriptionId:
      {
        type: string,
        minLength: 3,
        maxLength: 255,
        pattern: "^[a-z0-9][a-z0-9_-]*:[A-Za-z0-9:_-]+$",
        description: Opaque subscription ID.,
      }
    MobilePlatform: { type: string, enum: [ios, android] }
    IanaTimeZone:
      {
        type: string,
        minLength: 1,
        maxLength: 100,
        description: "Validated IANA time-zone identifier, such as America/Los_Angeles.",
      }
    InstallationCreateRequest:
      type: object
      required: [platform, locale, timeZone, appVersion]
      additionalProperties: false
      properties:
        platform: { $ref: "#/components/schemas/MobilePlatform" }
        locale: { type: string, minLength: 1, maxLength: 35 }
        timeZone: { $ref: "#/components/schemas/IanaTimeZone" }
        appVersion: { type: string, minLength: 1, maxLength: 100 }
    InstallationCreateResponse:
      type: object
      required: [installationId, installationCredential]
      properties:
        installationId: { $ref: "#/components/schemas/InstallationId" }
        installationCredential:
          {
            type: string,
            minLength: 32,
            maxLength: 1024,
            x-tabi-sensitive: true,
            description: One-time opaque credential. Store only in platform secure storage; never log or persist in fixtures.,
          }
    PushTokenRegistration:
      type: object
      required: [platform, token]
      additionalProperties: false
      properties:
        platform: { $ref: "#/components/schemas/MobilePlatform" }
        token:
          {
            type: string,
            minLength: 8,
            maxLength: 4096,
            writeOnly: true,
            description: Write-only push token; never returned or logged.,
          }
    NotificationSubscriptionType:
      { type: string, enum: [service_alert, departure_reminder] }
    QuietHours:
      type: object
      required: [start, end, timeZone]
      additionalProperties: false
      properties:
        start:
          {
            type: string,
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$",
            description: Local wall-clock time in HH:mm.,
          }
        end:
          {
            type: string,
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$",
            description: Local wall-clock time in HH:mm.,
          }
        timeZone: { $ref: "#/components/schemas/IanaTimeZone" }
    SubscriptionCreateRequest:
      type: object
      required: [type, expiresAt]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/NotificationSubscriptionType" }
        routeIds:
          {
            type: array,
            maxItems: 20,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/QualifiedId" },
          }
        stopIds:
          {
            type: array,
            maxItems: 20,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/QualifiedId" },
          }
        modes:
          {
            type: array,
            maxItems: 6,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/TransitMode" },
          }
        sourceIds:
          {
            type: array,
            maxItems: 20,
            uniqueItems: true,
            items: { type: string, minLength: 1, maxLength: 128 },
          }
        tripId: { $ref: "#/components/schemas/QualifiedId" }
        remindAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        quietHours: { $ref: "#/components/schemas/QuietHours" }
      description: service_alert needs at least one scope; departure_reminder needs tripId and remindAt before expiresAt. The server enforces per-installation limits and a maximum expiry window.
    Subscription:
      allOf:
        - { $ref: "#/components/schemas/SubscriptionCreateRequest" }
        - type: object
          required: [id, type, expiresAt]
          properties: { id: { $ref: "#/components/schemas/SubscriptionId" } }
    SubscriptionCollection:
      type: object
      required: [subscriptions]
      properties:
        {
          subscriptions:
            {
              type: array,
              items: { $ref: "#/components/schemas/Subscription" },
            },
        }
    HealthResponse:
      {
        type: object,
        required: [status, requestId],
        properties:
          { status: { type: string, enum: [ok] }, requestId: { type: string } },
      }
    Timestamp:
      { type: string, format: date-time, description: ISO 8601 UTC instant. }
    ServiceDate:
      {
        type: string,
        format: date,
        description: Service date in the agency service-day calendar.,
      }
    QualifiedId:
      {
        type: string,
        minLength: 3,
        maxLength: 255,
        pattern: "^[a-z0-9][a-z0-9_-]*:[A-Za-z0-9:_-]+$",
        description: Stable source-qualified identifier.,
      }
    Coordinate:
      {
        type: array,
        description: "WGS84 position [longitude, latitude].",
        minItems: 2,
        maxItems: 2,
        items: { type: number },
      }
    TransitMode:
      {
        type: string,
        enum: [bus, light_rail, streetcar, commuter_rail, ferry, unknown],
      }
    FreshnessStatus: { type: string, enum: [fresh, aging, stale, unknown] }
    Freshness:
      type: object
      required: [source, fetchedAt, processedAt, status, ageSeconds, isRealtime]
      properties:
        source: { type: string, minLength: 1, maxLength: 128 }
        sourceUpdatedAt: { $ref: "#/components/schemas/Timestamp" }
        entityUpdatedAt: { $ref: "#/components/schemas/Timestamp" }
        fetchedAt: { $ref: "#/components/schemas/Timestamp" }
        processedAt: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/FreshnessStatus" }
        ageSeconds: { type: integer, minimum: 0 }
        isRealtime: { type: boolean }
    ErrorCode:
      {
        type: string,
        enum:
          [
            validation_error,
            not_found,
            conflict,
            rate_limited,
            source_unavailable,
            feature_unavailable,
            temporarily_unavailable,
            internal_error,
          ],
      }
    ErrorDetail:
      {
        type: object,
        required: [field, code],
        properties:
          {
            field: { type: string },
            code: { type: string },
            message: { type: string },
          },
      }
    Error:
      {
        type: object,
        required: [code, message, requestId],
        properties:
          {
            code: { $ref: "#/components/schemas/ErrorCode" },
            message: { type: string, maxLength: 500 },
            requestId: { type: string },
            retryAfterSeconds: { type: integer, minimum: 1 },
            source: { type: string },
            details:
              {
                type: array,
                items: { $ref: "#/components/schemas/ErrorDetail" },
              },
          },
      }
    ErrorResponse:
      {
        type: object,
        required: [error],
        properties: { error: { $ref: "#/components/schemas/Error" } },
      }
    Route:
      {
        type: object,
        required: [id, mode, shortName, longName],
        properties:
          {
            id: { $ref: "#/components/schemas/QualifiedId" },
            mode: { $ref: "#/components/schemas/TransitMode" },
            shortName: { type: string },
            longName: { type: string },
            color: { type: string, pattern: "^[0-9A-Fa-f]{6}$" },
            textColor: { type: string, pattern: "^[0-9A-Fa-f]{6}$" },
          },
      }
    RouteCollection:
      {
        type: object,
        required: [routes, staticFeedVersion],
        properties:
          {
            routes:
              { type: array, items: { $ref: "#/components/schemas/Route" } },
            nextCursor: { type: string },
            staticFeedVersion: { type: string },
          },
      }
    Stop:
      {
        type: object,
        required: [id, name, coordinate, modes],
        properties:
          {
            id: { $ref: "#/components/schemas/QualifiedId" },
            name: { type: string },
            coordinate: { $ref: "#/components/schemas/Coordinate" },
            modes:
              {
                type: array,
                minItems: 1,
                items: { $ref: "#/components/schemas/TransitMode" },
              },
            parentStopId: { $ref: "#/components/schemas/QualifiedId" },
            routeIds:
              {
                type: array,
                items: { $ref: "#/components/schemas/QualifiedId" },
              },
            wheelchairAccessible: { type: boolean },
          },
      }
    StopCollection:
      {
        type: object,
        required: [stops],
        properties:
          {
            stops:
              { type: array, items: { $ref: "#/components/schemas/Stop" } },
            nextCursor: { type: string },
          },
      }
    NearbyStop:
      {
        allOf:
          [
            { $ref: "#/components/schemas/Stop" },
            {
              type: object,
              required: [distanceMeters],
              properties: { distanceMeters: { type: number, minimum: 0 } },
            },
          ],
      }
    NearbyStopGroup:
      {
        type: object,
        required: [mode, stops],
        properties:
          {
            mode: { $ref: "#/components/schemas/TransitMode" },
            stops:
              {
                type: array,
                items: { $ref: "#/components/schemas/NearbyStop" },
              },
          },
      }
    NearbyStopsResponse:
      {
        type: object,
        required: [distanceType, groups, freshness],
        properties:
          {
            distanceType: { type: string, enum: [straight_line] },
            groups:
              {
                type: array,
                items: { $ref: "#/components/schemas/NearbyStopGroup" },
              },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    StopDetailResponse:
      {
        type: object,
        required: [stop, staticFeedVersion, freshness],
        properties:
          {
            stop: { $ref: "#/components/schemas/Stop" },
            staticFeedVersion: { type: string },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    ArrivalStatus:
      {
        type: string,
        enum: [scheduled, estimated, cancelled, skipped, unknown],
      }
    Arrival:
      type: object
      required: [id, stopId, routeId, status, scheduledAt, freshness]
      properties:
        id:
          {
            type: string,
            maxLength: 255,
            description: Stable arrival instance ID for this response window.,
          }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
        routeId: { $ref: "#/components/schemas/QualifiedId" }
        directionId: { type: integer, enum: [0, 1] }
        headsign: { type: string, maxLength: 500 }
        scheduledAt: { $ref: "#/components/schemas/Timestamp" }
        estimatedAt: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/ArrivalStatus" }
        vehicleId: { $ref: "#/components/schemas/QualifiedId" }
        tripId: { $ref: "#/components/schemas/QualifiedId" }
        stopSequence: { type: integer, minimum: 0 }
        alertIds:
          { type: array, items: { $ref: "#/components/schemas/QualifiedId" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    ArrivalCollection:
      {
        type: object,
        required: [stopId, arrivals, freshness],
        properties:
          {
            stopId: { $ref: "#/components/schemas/QualifiedId" },
            arrivals:
              { type: array, items: { $ref: "#/components/schemas/Arrival" } },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    ScheduleTime:
      type: object
      required: [tripId, routeId, stopId, serviceDate, serviceDaySeconds]
      properties:
        tripId: { $ref: "#/components/schemas/QualifiedId" }
        routeId: { $ref: "#/components/schemas/QualifiedId" }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
        directionId: { type: integer, enum: [0, 1] }
        headsign: { type: string, maxLength: 500 }
        serviceDate: { $ref: "#/components/schemas/ServiceDate" }
        serviceDaySeconds:
          {
            type: integer,
            minimum: 0,
            maximum: 172799,
            description: Seconds since service-day midnight; may exceed 86400.,
          }
        departureAt: { $ref: "#/components/schemas/Timestamp" }
    ScheduleCollection:
      {
        type: object,
        required: [stopId, serviceDate, staticFeedVersion, schedule],
        properties:
          {
            stopId: { $ref: "#/components/schemas/QualifiedId" },
            serviceDate: { $ref: "#/components/schemas/ServiceDate" },
            staticFeedVersion: { type: string },
            schedule:
              {
                type: array,
                items: { $ref: "#/components/schemas/ScheduleTime" },
              },
            nextCursor: { type: string },
          },
      }
    RouteDirection:
      {
        type: object,
        required: [directionId],
        properties:
          {
            directionId: { type: integer, enum: [0, 1] },
            headsign: { type: string, maxLength: 500 },
          },
      }
    RouteDetailResponse:
      {
        type: object,
        required: [route, directions, staticFeedVersion, freshness],
        properties:
          {
            route: { $ref: "#/components/schemas/Route" },
            directions:
              {
                type: array,
                items: { $ref: "#/components/schemas/RouteDirection" },
              },
            staticFeedVersion: { type: string },
            alertIds:
              {
                type: array,
                items: { $ref: "#/components/schemas/QualifiedId" },
              },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    RouteShapeFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [LineString] }
            coordinates:
              {
                type: array,
                minItems: 2,
                items: { $ref: "#/components/schemas/Coordinate" },
              }
        properties:
          type: object
          required: [shapeId, routeId]
          properties:
            shapeId: { $ref: "#/components/schemas/QualifiedId" }
            routeId: { $ref: "#/components/schemas/QualifiedId" }
            directionId: { type: integer, enum: [0, 1] }
    RouteShapeFeatureCollection:
      {
        type: object,
        required: [type, features, staticFeedVersion],
        properties:
          {
            type: { type: string, enum: [FeatureCollection] },
            features:
              {
                type: array,
                items: { $ref: "#/components/schemas/RouteShapeFeature" },
              },
            staticFeedVersion: { type: string },
          },
      }
    RouteStop:
      {
        allOf:
          [
            { $ref: "#/components/schemas/Stop" },
            {
              type: object,
              required: [sequence],
              properties: { sequence: { type: integer, minimum: 0 } },
            },
          ],
      }
    RouteStopCollection:
      {
        type: object,
        required: [routeId, stops, staticFeedVersion],
        properties:
          {
            routeId: { $ref: "#/components/schemas/QualifiedId" },
            directionId: { type: integer, enum: [0, 1] },
            stops:
              {
                type: array,
                items: { $ref: "#/components/schemas/RouteStop" },
              },
            staticFeedVersion: { type: string },
          },
      }
    StaticArtifact:
      type: object
      required: [name, version, sha256, mediaType, sizeBytes]
      properties:
        name: { type: string, enum: [stops, routes, schedules, shapes] }
        version: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        mediaType: { type: string, enum: [application/json] }
        sizeBytes: { type: integer, minimum: 0 }
        url:
          {
            type: string,
            format: uri,
            description: Optional only after artifact storage policy approval.,
          }
    StaticManifestResponse:
      {
        type: object,
        required: [staticFeedVersion, publishedAt, artifacts, freshness],
        properties:
          {
            staticFeedVersion: { type: string },
            publishedAt: { $ref: "#/components/schemas/Timestamp" },
            artifacts:
              {
                type: array,
                items: { $ref: "#/components/schemas/StaticArtifact" },
              },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    AlertEffect:
      {
        type: string,
        enum:
          [
            no_service,
            reduced_service,
            significant_delays,
            detour,
            stop_moved,
            modified_service,
            other,
            unknown,
          ],
      }
    AlertSeverity: { type: string, enum: [info, warning, severe, unknown] }
    AlertPeriod:
      type: object
      properties:
        startAt: { $ref: "#/components/schemas/Timestamp" }
        endAt: { $ref: "#/components/schemas/Timestamp" }
    AlertEntity:
      type: object
      properties:
        routeId: { $ref: "#/components/schemas/QualifiedId" }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
        tripId: { $ref: "#/components/schemas/QualifiedId" }
    Alert:
      type: object
      required: [id, revision, header, periods, source, freshness]
      properties:
        id: { $ref: "#/components/schemas/QualifiedId" }
        revision: { type: string, maxLength: 255 }
        header: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 10000 }
        cause: { type: string, maxLength: 500 }
        effect: { $ref: "#/components/schemas/AlertEffect" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        periods:
          {
            type: array,
            minItems: 1,
            items: { $ref: "#/components/schemas/AlertPeriod" },
          }
        informedEntities:
          { type: array, items: { $ref: "#/components/schemas/AlertEntity" } }
        sourceUrl: { type: string, format: uri }
        source: { type: string, maxLength: 128 }
        freshness: { $ref: "#/components/schemas/Freshness" }
    AlertCollection:
      {
        type: object,
        required: [alerts, freshness],
        properties:
          {
            alerts:
              { type: array, items: { $ref: "#/components/schemas/Alert" } },
            nextCursor: { type: string },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    AlertDetailResponse:
      {
        type: object,
        required: [alert],
        properties: { alert: { $ref: "#/components/schemas/Alert" } },
      }
    Vehicle:
      type: object
      required: [id, sourceVehicleId, mode, coordinate, inService, freshness]
      properties:
        id: { $ref: "#/components/schemas/QualifiedId" }
        sourceVehicleId: { type: string }
        mode: { $ref: "#/components/schemas/TransitMode" }
        routeId: { $ref: "#/components/schemas/QualifiedId" }
        tripId: { $ref: "#/components/schemas/QualifiedId" }
        blockId: { $ref: "#/components/schemas/QualifiedId" }
        directionId: { type: integer, enum: [0, 1] }
        headsign: { type: string }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        bearing: { type: number, minimum: 0, maximum: 360 }
        speedMetersPerSecond: { type: number, minimum: 0, nullable: true }
        currentStopId: { $ref: "#/components/schemas/QualifiedId" }
        nextStopId: { $ref: "#/components/schemas/QualifiedId" }
        scheduleDeviationSeconds: { type: integer, nullable: true }
        inService: { type: boolean }
        freshness: { $ref: "#/components/schemas/Freshness" }
    VehicleCollection:
      {
        type: object,
        required: [snapshotId, vehicles, freshness],
        properties:
          {
            snapshotId: { type: string },
            vehicles:
              { type: array, items: { $ref: "#/components/schemas/Vehicle" } },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    VehicleFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        geometry:
          {
            type: object,
            required: [type, coordinates],
            properties:
              {
                type: { type: string, enum: [Point] },
                coordinates: { $ref: "#/components/schemas/Coordinate" },
              },
          }
        properties: { $ref: "#/components/schemas/Vehicle" }
    VehicleFeatureCollection:
      {
        type: object,
        required: [type, features, snapshotId, freshness],
        properties:
          {
            type: { type: string, enum: [FeatureCollection] },
            features:
              {
                type: array,
                items: { $ref: "#/components/schemas/VehicleFeature" },
              },
            snapshotId: { type: string },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    VehicleSearchResponse:
      {
        type: object,
        required: [query, vehicles, freshness],
        properties:
          {
            query: { type: string },
            vehicles:
              { type: array, items: { $ref: "#/components/schemas/Vehicle" } },
            freshness: { $ref: "#/components/schemas/Freshness" },
          },
      }
    VehicleDetailResponse:
      {
        type: object,
        required: [vehicle],
        properties: { vehicle: { $ref: "#/components/schemas/Vehicle" } },
      }
    PlaceKind:
      {
        type: string,
        enum:
          [
            stop,
            station,
            route,
            vehicle,
            address,
            poi,
            intersection,
            place,
            unknown,
          ],
      }
    PlaceKinds:
      {
        type: string,
        maxLength: 300,
        pattern: "^(stop|station|route|vehicle|address|poi|intersection|place|unknown)(,(stop|station|route|vehicle|address|poi|intersection|place|unknown))*$",
      }
    PlaceSource:
      {
        type: string,
        enum: [tabi, external, unknown],
        description: Tabi identifies normalized transit data; external identifies a normalized approved place provider without exposing its payload.,
      }
    BoundingBox:
      {
        type: array,
        description: "WGS84 bounding box [west, south, east, north].",
        minItems: 4,
        maxItems: 4,
        items: { type: number },
      }
    PlaceResult:
      type: object
      required: [id, source, kind, name]
      properties:
        id:
          {
            type: string,
            minLength: 1,
            maxLength: 512,
            description: Opaque stable result identifier within its source.,
          }
        source: { $ref: "#/components/schemas/PlaceSource" }
        kind: { $ref: "#/components/schemas/PlaceKind" }
        name: { type: string, minLength: 1, maxLength: 1000 }
        subtitle: { type: string, maxLength: 1000 }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        bbox: { $ref: "#/components/schemas/BoundingBox" }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
        routeId: { $ref: "#/components/schemas/QualifiedId" }
        vehicleId: { $ref: "#/components/schemas/QualifiedId" }
        externalReference:
          {
            type: string,
            maxLength: 512,
            description: Opaque provider reference only when terms permit returning it.,
          }
        attribution:
          {
            type: string,
            maxLength: 2000,
            description: "Required display attribution, when supplied by the source.",
          }
    PlaceSearchResponse:
      type: object
      required: [query, results, freshness]
      properties:
        query: { type: string }
        results:
          { type: array, items: { $ref: "#/components/schemas/PlaceResult" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    ReverseGeocodeResponse:
      type: object
      required: [result, freshness]
      properties:
        result: { $ref: "#/components/schemas/PlaceResult" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    JourneyLocation:
      oneOf:
        - { $ref: "#/components/schemas/CoordinateJourneyLocation" }
        - { $ref: "#/components/schemas/StopJourneyLocation" }
        - { $ref: "#/components/schemas/PlaceJourneyLocation" }
        - { $ref: "#/components/schemas/LocalJourneyLocation" }
      discriminator:
        propertyName: type
        mapping:
          coordinate: "#/components/schemas/CoordinateJourneyLocation"
          stop: "#/components/schemas/StopJourneyLocation"
          place: "#/components/schemas/PlaceJourneyLocation"
          saved: "#/components/schemas/LocalJourneyLocation"
          recent: "#/components/schemas/LocalJourneyLocation"
    CoordinateJourneyLocation:
      type: object
      required: [type, coordinate]
      properties:
        type: { type: string, enum: [coordinate] }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        label: { type: string, maxLength: 500 }
    StopJourneyLocation:
      type: object
      required: [type, stopId]
      properties:
        type: { type: string, enum: [stop] }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
        label: { type: string, maxLength: 500 }
    PlaceJourneyLocation:
      type: object
      required: [type, placeId, coordinate]
      properties:
        type: { type: string, enum: [place] }
        placeId:
          {
            type: string,
            minLength: 1,
            maxLength: 512,
            description: Opaque identifier from an immediately preceding picker response.,
          }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        label: { type: string, maxLength: 500 }
    LocalJourneyLocation:
      type: object
      required: [type, localId, coordinate]
      properties:
        type: { type: string, enum: [saved, recent] }
        localId:
          {
            type: string,
            minLength: 1,
            maxLength: 255,
            description: Device-local reference; the backend does not persist it.,
          }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        label: { type: string, maxLength: 500 }
    JourneyTime:
      type: object
      required: [mode, value]
      properties:
        mode: { type: string, enum: [depart_at, arrive_by] }
        value: { $ref: "#/components/schemas/Timestamp" }
    JourneyOptimize:
      { type: string, enum: [fastest, fewer_transfers, least_walking] }
    JourneyPreferenceName:
      {
        type: string,
        enum:
          [
            modes,
            max_transfers,
            max_walking_meters,
            wheelchair_accessible,
            optimize,
          ],
      }
    JourneyPreferences:
      type: object
      properties:
        modes:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/TransitMode" },
          }
        maxTransfers:
          {
            type: integer,
            minimum: 0,
            maximum: 6,
            description: Hard maximum; plans exceeding it are excluded.,
          }
        maxWalkingMeters:
          {
            type: integer,
            minimum: 0,
            maximum: 30000,
            description: Hard maximum; plans exceeding it are excluded.,
          }
        wheelchairAccessible:
          {
            type: boolean,
            description: Requests sourced accessibility support; unsupported provider capability is disclosed.,
          }
        optimize: { $ref: "#/components/schemas/JourneyOptimize" }
    JourneyPlanRequest:
      type: object
      required: [origin, destination, time]
      properties:
        origin: { $ref: "#/components/schemas/JourneyLocation" }
        destination: { $ref: "#/components/schemas/JourneyLocation" }
        time: { $ref: "#/components/schemas/JourneyTime" }
        preferences: { $ref: "#/components/schemas/JourneyPreferences" }
    JourneyEndpoint:
      type: object
      required: [type, coordinate]
      properties:
        type: { type: string, enum: [coordinate, stop, place, saved, recent] }
        coordinate: { $ref: "#/components/schemas/Coordinate" }
        label: { type: string, maxLength: 500 }
        stopId: { $ref: "#/components/schemas/QualifiedId" }
    JourneyGeometry:
      type: object
      required: [coordinates, isApproximate]
      properties:
        coordinates:
          {
            type: array,
            minItems: 2,
            items: { $ref: "#/components/schemas/Coordinate" },
          }
        isApproximate:
          {
            type: boolean,
            description: True when geometry is not provider or GTFS shape geometry.,
          }
    JourneyLegType: { type: string, enum: [walk, transit, wait, transfer] }
    JourneyLeg:
      type: object
      required: [type, startAt, endAt, durationSeconds, from, to]
      properties:
        type: { $ref: "#/components/schemas/JourneyLegType" }
        startAt: { $ref: "#/components/schemas/Timestamp" }
        endAt: { $ref: "#/components/schemas/Timestamp" }
        durationSeconds: { type: integer, minimum: 0 }
        from: { $ref: "#/components/schemas/JourneyEndpoint" }
        to: { $ref: "#/components/schemas/JourneyEndpoint" }
        distanceMeters: { type: integer, minimum: 0 }
        route: { $ref: "#/components/schemas/Route" }
        tripId: { $ref: "#/components/schemas/QualifiedId" }
        headsign: { type: string, maxLength: 500 }
        boardStopId: { $ref: "#/components/schemas/QualifiedId" }
        alightStopId: { $ref: "#/components/schemas/QualifiedId" }
        realtime: { type: boolean }
        geometry: { $ref: "#/components/schemas/JourneyGeometry" }
        alertIds:
          { type: array, items: { $ref: "#/components/schemas/QualifiedId" } }
        accessibility: { type: string, enum: [supported, unsupported, unknown] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    UnsupportedJourneyPreference:
      type: object
      required: [name, reason]
      properties:
        name: { $ref: "#/components/schemas/JourneyPreferenceName" }
        reason: { type: string, maxLength: 500 }
    Itinerary:
      type: object
      required:
        [
          id,
          departureAt,
          arrivalAt,
          durationSeconds,
          transfers,
          walkingMeters,
          legs,
          freshness,
        ]
      properties:
        id:
          {
            type: string,
            minLength: 1,
            maxLength: 512,
            description: Opaque itinerary identifier scoped to this response.,
          }
        departureAt: { $ref: "#/components/schemas/Timestamp" }
        arrivalAt: { $ref: "#/components/schemas/Timestamp" }
        durationSeconds: { type: integer, minimum: 0 }
        transfers: { type: integer, minimum: 0 }
        walkingMeters: { type: integer, minimum: 0 }
        score: { type: number }
        rankingReason: { type: string, maxLength: 1000 }
        legs:
          {
            type: array,
            minItems: 1,
            items: { $ref: "#/components/schemas/JourneyLeg" },
          }
        alertIds:
          { type: array, items: { $ref: "#/components/schemas/QualifiedId" } }
        accessibility: { type: string, enum: [supported, unsupported, unknown] }
        freshness: { $ref: "#/components/schemas/Freshness" }
    JourneyPlanResponse:
      type: object
      required: [origin, destination, itineraries, source, freshness]
      properties:
        planId:
          {
            type: string,
            maxLength: 512,
            description: Opaque optional identifier; clients must not treat it as durable.,
          }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        origin: { $ref: "#/components/schemas/JourneyEndpoint" }
        destination: { $ref: "#/components/schemas/JourneyEndpoint" }
        itineraries:
          { type: array, items: { $ref: "#/components/schemas/Itinerary" } }
        appliedPreferences:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/JourneyPreferenceName" },
          }
        unsupportedPreferences:
          {
            type: array,
            items:
              { $ref: "#/components/schemas/UnsupportedJourneyPreference" },
          }
        source:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: Normalized planner source identifier.,
          }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Feature:
      {
        type: object,
        required: [enabled],
        properties: { enabled: { type: boolean }, reason: { type: string } },
      }
    ConfigResponse:
      {
        type: object,
        required:
          [
            apiVersion,
            minimumAppVersion,
            features,
            sources,
            staleThresholdSeconds,
            serviceBounds,
            staticFeed,
          ],
        properties:
          {
            apiVersion: { type: string },
            minimumAppVersion: { type: string },
            features:
              {
                type: object,
                additionalProperties: { $ref: "#/components/schemas/Feature" },
              },
            sources:
              {
                type: object,
                additionalProperties: { $ref: "#/components/schemas/Feature" },
              },
            pollingRecommendations:
              {
                type: object,
                additionalProperties: { type: integer, minimum: 1 },
              },
            staleThresholdSeconds:
              {
                type: object,
                additionalProperties: { type: integer, minimum: 1 },
              },
            serviceBounds:
              {
                type: object,
                required: [bbox],
                properties:
                  {
                    bbox:
                      {
                        type: array,
                        minItems: 4,
                        maxItems: 4,
                        items: { type: number },
                      },
                  },
              },
            staticFeed:
              {
                type: object,
                required: [version, publishedAt],
                properties:
                  {
                    version: { type: string },
                    publishedAt: { $ref: "#/components/schemas/Timestamp" },
                  },
              },
            urls:
              {
                type: object,
                additionalProperties: { type: string, format: uri },
              },
          },
      }
