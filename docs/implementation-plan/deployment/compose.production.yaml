services:
  api:
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 1.0

  realtime-poller:
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 1.0

  notification-worker:
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.5

  migrate:
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gtfs-importer:
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: 1.5

  postgres:
    shm_size: 256m
    mem_limit: 1280m
    cpus: 1.5

  caddy:
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
